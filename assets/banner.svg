<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Ritika - Full-Stack Developer, Cloud and Java" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0F2B"/>
      <stop offset="0.45" stop-color="#414B9E"/>
      <stop offset="0.75" stop-color="#AA74A0"/>
      <stop offset="1" stop-color="#FF5CA8"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB86B"/>
      <stop offset="1" stop-color="#FF5CA8"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#414B9E"/>
      <stop offset="1" stop-color="#BC6CFF"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1A5E"/>
      <stop offset="1" stop-color="#0B0F2B"/>
    </linearGradient>
    <mask id="sunstripes">
      <rect width="1000" height="320" fill="#fff"/>
      <rect x="380" y="196" width="240" height="3" fill="#000"/>
      <rect x="380" y="206" width="240" height="5" fill="#000"/>
      <rect x="380" y="218" width="240" height="7" fill="#000"/>
    </mask>
    <clipPath id="frame"><rect x="10" y="10" width="980" height="300" rx="12"/></clipPath>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="spark" d="M0,-10 C1,-3 3,-1 10,0 C3,1 1,3 0,10 C-1,3 -3,1 -10,0 C-3,-1 -1,-3 0,-10Z"/>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="10" y="10" width="980" height="300" fill="url(#sky)"/>

    <!-- sun -->
    <circle cx="500" cy="200" r="105" fill="url(#sun)" mask="url(#sunstripes)" opacity="0.95"/>

    <!-- ground + grid -->
    <rect x="10" y="226" width="980" height="84" fill="url(#ground)"/>
    <g stroke="#00F0FF" stroke-width="1.3" opacity="0.75" filter="url(#softglow)">
      <line x1="10" y1="226" x2="990" y2="226"/>
      <line x1="10" y1="238" x2="990" y2="238"/>
      <line x1="10" y1="254" x2="990" y2="254"/>
      <line x1="10" y1="276" x2="990" y2="276"/>
      <line x1="10" y1="304" x2="990" y2="304"/>
      <line x1="500" y1="226" x2="500" y2="310"/>
      <line x1="500" y1="226" x2="380" y2="310"/>
      <line x1="500" y1="226" x2="620" y2="310"/>
      <line x1="500" y1="226" x2="230" y2="310"/>
      <line x1="500" y1="226" x2="770" y2="310"/>
      <line x1="500" y1="226" x2="40" y2="310"/>
      <line x1="500" y1="226" x2="960" y2="310"/>
      <line x1="500" y1="226" x2="-200" y2="310"/>
      <line x1="500" y1="226" x2="1200" y2="310"/>
    </g>

    <!-- sparkles -->
    <g fill="#E2C99E" filter="url(#softglow)">
      <use href="#spark" transform="translate(120,90) scale(1.4)"/>
      <use href="#spark" transform="translate(880,80) scale(1.8)"/>
      <use href="#spark" transform="translate(240,170) scale(0.8)"/>
      <use href="#spark" transform="translate(770,150) scale(1)"/>
      <use href="#spark" transform="translate(60,200) scale(0.7)" fill="#9792CB"/>
      <use href="#spark" transform="translate(940,190) scale(0.9)" fill="#9792CB"/>
    </g>

    <!-- title text -->
    <text x="500" y="150" text-anchor="middle" font-family="'Trebuchet MS', 'Segoe UI', Verdana, sans-serif" font-size="88" font-weight="900" font-style="italic" letter-spacing="6" fill="#FF5CA8" stroke="#FFFFFF" stroke-width="1.2" filter="url(#glow)">Ritika</text>
    <text x="500" y="192" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="21" font-weight="700" letter-spacing="5" fill="#00F0FF" filter="url(#softglow)">FULL-STACK DEV · CLOUD · JAVA</text>
    <text x="500" y="213" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="13" letter-spacing="4" fill="#E2C99E">B.TECH CSE @ LPU ✦ 2023 - NOW</text>

    <!-- window title bar -->
    <rect x="10" y="10" width="980" height="30" fill="url(#bar)"/>
    <text x="28" y="31" font-family="'Courier New', Consolas, monospace" font-size="15" font-weight="700" fill="#FFFFFF">▣ ritika.exe</text>
    <g stroke="#0B0F2B" stroke-width="1.5">
      <rect x="878" y="16" width="28" height="18" rx="3" fill="#00F0FF"/>
      <rect x="912" y="16" width="28" height="18" rx="3" fill="#FFB86B"/>
      <rect x="946" y="16" width="28" height="18" rx="3" fill="#FF5CA8"/>
    </g>
    <g stroke="#0B0F2B" stroke-width="2" fill="none" stroke-linecap="round">
      <line x1="886" y1="29" x2="898" y2="29"/>
      <rect x="920" y="21" width="12" height="9"/>
      <line x1="955" y1="21" x2="965" y2="30"/><line x1="965" y1="21" x2="955" y2="30"/>
    </g>
  </g>
  <rect x="10" y="10" width="980" height="300" rx="12" fill="none" stroke="#BC6CFF" stroke-width="3"/>
</svg>
